name: Build Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyinstaller cloudscraper

      - name: Build Python executables
        run: |
          cd electron/qbit-plugins
          pyinstaller --onefile --name qbit-runner --distpath . --add-data "engines:engines" --add-data "novaprinter.py:." --add-data "helpers.py:." --hidden-import cloudscraper --clean qbit-runner.py
          rm -rf build qbit-runner.spec
          cd ..
          pyinstaller --onefile --name tmdb-provider --distpath . --clean tmdb-provider.py
          rm -rf build tmdb-provider.spec
          pyinstaller --onefile --name latino-providers --distpath . --clean latino-providers.py
          rm -rf build latino-providers.spec
        shell: bash

      - name: Install npm deps
        run: npm ci

      - name: Build and package
        run: npm run build && npx electron-builder --publish never
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaPilot-Setup
          path: release/*.exe

      - name: Create Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

      - name: Create Release (branch push)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          # Get tag annotation if it exists, otherwise use commit-based fallback
          $tagMsg = git tag -l --format='%(contents)' $tag 2>$null
          if (-not $tagMsg) { $tagMsg = "Release $version — commit ${{ github.sha }}" }
          # Delete existing release with this tag if present, then recreate
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag $exe.FullName release/latest.yml release/*.blockmap `
            --title "$version" `
            --notes $tagMsg
        shell: pwsh
