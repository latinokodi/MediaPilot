name: Build Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyinstaller cloudscraper

      - name: Build Python executables
        run: |
          cd electron/qbit-plugins
          pyinstaller --onefile --name qbit-runner --distpath . --add-data "engines:engines" --add-data "novaprinter.py:." --add-data "helpers.py:." --hidden-import cloudscraper --clean qbit-runner.py
          rm -rf build qbit-runner.spec
          cd ..
          pyinstaller --onefile --name tmdb-provider --distpath . --clean tmdb-provider.py
          rm -rf build tmdb-provider.spec
          pyinstaller --onefile --name latino-providers --distpath . --clean latino-providers.py
          rm -rf build latino-providers.spec
        shell: bash

      - name: Install npm deps
        run: npm ci

      - name: Build and package
        run: npm run build && npx electron-builder --publish never
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaPilot-Setup
          path: release/*.exe

      - name: Create Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

      - name: Publish Release (branch push)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) { throw "No se genero el instalador en release/" }
          $blockmap = Get-ChildItem release/*.blockmap | Select-Object -First 1
          # NUNCA se borra el release. Borrarlo y volverlo a crear dejaba unos
          # segundos sin ninguna version publicada, y el actualizador de la app
          # que consultase justo entonces fallaba con
          # "No published versions on GitHub". Si el release ya existe, se
          # reemplazan sus archivos; si no existe, se crea.
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # La version ya esta publicada: no se toca. Los artefactos de una
            # version publicada no se reemplazan, asi que un cambio que no sube
            # la version (documentacion, por ejemplo) no altera lo que ya se
            # estan descargando los usuarios.
            Write-Host "El release $tag ya existe: se deja como esta."
          } else {
            gh release create $tag $exe.FullName release/latest.yml $blockmap.FullName `
              --title "$version" `
              --notes "Version $version"
          }
        shell: pwsh
